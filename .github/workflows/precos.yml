name: Precos e gatilhos

on:
  schedule:
    - cron: "7 * * * *"        # de hora em hora, minuto 7 (UTC)  - ativado por Gustavo
  workflow_dispatch:            # botao "Run workflow" para rodar na hora
  push:                         # roda tambem quando a config ou o script mudam
    branches: [main]
    paths:
      - "config.json"
      - "scripts/precos.py"
      - ".github/workflows/precos.yml"

permissions:
  contents: write

concurrency:
  group: grava-repo
  cancel-in-progress: false

jobs:
  precos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Buscar precos e conferir gatilhos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/precos.py

      - name: Reenviar alertas de noticia pendentes (reserva)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/enviar_alertas.py

      - name: Salvar no repositorio
        if: always()
        run: |
          git config user.name "awareness-bot"
          git config user.email "awareness-bot@users.noreply.github.com"
          git add precos.json estado_alertas.json
          if git diff --cached --quiet; then echo "sem mudancas"; exit 0; fi
          git commit -q -m "precos $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q && exit 0
            echo "push recusado, tentativa $i"; sleep $((i * 5))
          done
          exit 1
