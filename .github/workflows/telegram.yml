name: Alertas de noticia (Telegram)

on:
  push:                         # o agente gravou um alerta.json novo
    branches: [main]
    paths:
      - "alerta.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grava-repo
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Enviar alertas pendentes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/enviar_alertas.py

      - name: Salvar estado
        run: |
          git config user.name "awareness-bot"
          git config user.email "awareness-bot@users.noreply.github.com"
          git add estado_alertas.json
          if git diff --cached --quiet; then echo "sem mudancas"; exit 0; fi
          git commit -q -m "alertas enviados $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q && exit 0
            echo "push recusado, tentativa $i"; sleep $((i * 5))
          done
          exit 1
